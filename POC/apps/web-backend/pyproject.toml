[project]
name = "web-backend"
version = "0.1.0"
description = "Clean Architecture FastAPI backend for VietASR POC"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "python-multipart>=0.0.6",
    "websockets>=11.0.0",
    "httpx>=0.24.0",
    "minio>=7.1.15"
]
